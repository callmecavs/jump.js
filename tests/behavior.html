<!doctype html>

<html lang="en">
  <head>
    <style>
      * {
        all: unset;
        display: revert;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      .page {
      }

      .target {
        height: 24px;
        background-color: red;
      }

      .spacer {
        --spacer-height: 400px;
      }

      .spacer.small {
        height: calc(var(--spacer-height));
      }

      .spacer.medium {
        height: calc(2 * var(--spacer-height));
      }

      .spacer.large {
        height: calc(3 * var(--spacer-height));
      }

      .sandbox {
        --sandbox-width: 240px;
        --sandbox-height: 240px;

        overflow: scroll;
        overscroll-behavior: contain;
        width: var(--sandbox-width);
        height: var(--sandbox-height);
        margin-top: 24px;
        margin-left: 24px;
      }

      .sandbox-content {
        position: relative;
      }

      .sandbox-content-x {
        width: calc(5 * var(--sandbox-width));
      }

      .sandbox-content-y {
        height: calc(5 * var(--sandbox-height));
      }

      .sandbox-target {
        position: absolute;
        width: 24px;
        height: 24px;
        background-color: red;
      }

      .root-target-x {
        top: 24px;
      }

      .root-target-x.root-clamp-start {
        left: -24px;
      }

      .root-target-x.root-target-element {
        left: var(--sandbox-width);
      }

      .root-target-x.root-target-string {
        left: calc(var(--sandbox-width) * 2);
      }

      .root-target-x.root-offset {
        left: calc(var(--sandbox-width) * 3);
      }

      .root-target-x.root-clamp-end {
        left: calc(100% + 24px);
      }

      .root-target-y {
        left: 24px;
      }

      .root-target-y.root-clamp-start {
        top: -24px;
      }

      .root-target-y.root-target-element {
        top: var(--sandbox-height);
      }

      .root-target-y.root-target-string {
        top: calc(var(--sandbox-height) * 2);
      }

      .root-target-y.root-offset {
        top: calc(var(--sandbox-height) * 3);
      }

      .root-target-y.root-clamp-end {
        top: calc(100% + 24px);
      }

      .focus-target-y {
        left: 24px;
      }

      .focus-target-element {
        top: var(--sandbox-height);
      }

      .focus-target-string {
        top: calc(var(--sandbox-height) * 2);
      }

      .focus-button {
        display: block;
        border: 1px solid red;
        padding: 12px 24px;
        margin-top: 24px;
        margin-left: 24px;
      }

      .focus-button:focus {
        outline-width: 1px;
        outline-style: solid;
        outline-color: blue;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="target start"></div>

      <div class="sandbox" data-root>
        <div class="sandbox-content sandbox-content-x sandbox-content-y">
          <div class="sandbox-target root-target-x root-clamp-start" data-root-x-clamp-start></div>
          <div class="sandbox-target root-target-x root-target-element" data-root-x-element></div>
          <div class="sandbox-target root-target-x root-target-string" data-root-x-string></div>
          <div class="sandbox-target root-target-x root-offset" data-root-x-offset></div>
          <div class="sandbox-target root-target-x root-clamp-end" data-root-x-clamp-end></div>

          <div class="sandbox-target root-target-y root-clamp-start" data-root-y-clamp-start></div>
          <div class="sandbox-target root-target-y root-target-element" data-root-y-element></div>
          <div class="sandbox-target root-target-y root-target-string" data-root-y-string></div>
          <div class="sandbox-target root-target-y root-offset" data-root-y-offset></div>
          <div class="sandbox-target root-target-y root-clamp-end" data-root-y-clamp-end></div>
        </div>
      </div>

      <div class="spacer small"></div>

      <div class="target element"></div>

      <div class="sandbox" data-focus>
        <div class="sandbox-content sandbox-content-y">
          <div class="sandbox-target focus-target-y focus-target-element" data-focus-element></div>
          <div class="sandbox-target focus-target-y focus-target-string" data-focus-string></div>
          <button class="focus-button" type="button" data-focus-button>Focus Button</button>
        </div>
      </div>

      <div class="spacer medium"></div>

      <div class="target string"></div>

      <div class="spacer large"></div>

      <div class="target end"></div>
    </div>

    <script type="module">
      import jump from "../dist/index.js"

      const scroll = (target, options) =>
        new Promise((resolve, reject) => {
          try {
            jump(target, {
              ...options,
              callback: () => {
                options?.callback?.()
                resolve()
              },
            })
          } catch (error) {
            reject(error)
          }
        })

      let latestElementScrollToArgs

      const captureElementScrollToArgs = element => {
        const original = element.scrollTo.bind(element)

        const wrapped = (...args) => {
          // `[{ left: ... }]` or `[{ top: ... }]` based on `axis`
          latestElementScrollToArgs = args
          original(...args)
        }

        element.scrollTo = wrapped
      }

      let latestWindowScrollToArgs

      const captureWindowScrollToArgs = () => {
        const original = window.scrollTo.bind(window)

        const wrapped = (...args) => {
          // `[{ left: ... }]` or `[{ top: ... }]` based on `axis`
          latestWindowScrollToArgs = args
          original(...args)
        }

        window.scrollTo = wrapped
      }

      window.fixtures = {
        captureElementScrollToArgs,
        getLatestElementScrollToArgs: () => latestElementScrollToArgs,

        captureWindowScrollToArgs,
        getLatestWindowScrollToArgs: () => latestWindowScrollToArgs,

        getElement: selector => {
          const match = document.querySelector(selector)
          if (match === null) throw new Error("`getElement` failed: `selector` didn't match.")
          if (!(match instanceof HTMLElement)) throw new Error("`getElement` failed: match isn't an `HTMLElement`.")
          return match
        },
        getElementY: element => element.getBoundingClientRect().top + window.scrollY,

        getElementScrollXMax: element => element.scrollWidth - element.clientWidth,
        getElementScrollYMax: element => element.scrollHeight - element.clientHeight,

        getWindowY: () => window.scrollY,
        setWindowY: top => window.scrollTo({ top }),

        getWindowScrollYMax: () => {
          const root = document.scrollingElement ?? document.documentElement
          return root.scrollHeight - root.clientHeight
        },

        jump,
        scroll,
      }
    </script>
  </body>
</html>
