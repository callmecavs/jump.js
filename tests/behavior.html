<!doctype html>

<html lang="en">
  <head>
    <style>
      * {
        all: unset;
        display: revert;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      .page {
      }

      .target {
        height: 25px;
        background-color: red;
      }

      .spacer {
        --height: 400px;
      }

      .spacer.small {
        height: calc(var(--height));
      }

      .spacer.medium {
        height: calc(2 * var(--height));
      }

      .spacer.large {
        height: calc(3 * var(--height));
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="target start"></div>
      <div class="spacer small"></div>
      <div class="target element"></div>
      <div class="spacer medium"></div>
      <div class="target string"></div>
      <div class="spacer large"></div>
      <div class="target end"></div>
    </div>

    <script type="module">
      import jump from "../dist/index.js"

      const scroll = (target, options) =>
        new Promise((resolve, reject) => {
          try {
            jump(target, {
              ...options,
              callback: () => {
                options?.callback?.()
                resolve()
              },
            })
          } catch (error) {
            reject(error)
          }
        })

      let latestWindowScrollToArgs

      const captureWindowScrollToArgs = () => {
        const original = window.scrollTo.bind(window)

        const wrapped = (...args) => {
          // `[{ left: ... }]` or `[{ top: ... }]` based on `axis`
          latestWindowScrollToArgs = args
          original(...args)
        }

        window.scrollTo = wrapped
      }

      window.fixtures = {
        captureWindowScrollToArgs,
        getLatestWindowScrollToArgs: () => latestWindowScrollToArgs,

        getWindowY: () => window.scrollY,
        getWindowYMax: () => {
          const root = document.scrollingElement ?? document.documentElement
          return root.scrollHeight - root.clientHeight
        },
        setWindowY: top => window.scrollTo({ top }),

        jump,
        scroll,
      }
    </script>
  </body>
</html>
