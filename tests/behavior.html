<!doctype html>

<html lang="en">
  <head>
    <style>
      * {
        all: unset;
        display: revert;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        width: 200dvw;
      }

      .page-target {
        width: 24px;
        height: 24px;
        background-color: red;
      }

      .page-target-x {
        position: absolute;
        top: 0;
      }

      .page-target-x.page-target-element {
        left: 25dvw;
      }

      .page-target-x.page-target-string {
        left: 75dvw;
      }

      .spacer {
        --spacer-height: 400px;
      }

      .spacer.small {
        height: calc(var(--spacer-height));
      }

      .spacer.medium {
        height: calc(2 * var(--spacer-height));
      }

      .spacer.large {
        height: calc(3 * var(--spacer-height));
      }

      .sandbox {
        --sandbox-width: 240px;
        --sandbox-height: 240px;

        overflow: scroll;
        overscroll-behavior: contain;
        width: var(--sandbox-width);
        height: var(--sandbox-height);
        margin-top: 24px;
        margin-left: 24px;
      }

      .sandbox-content {
        position: relative;
      }

      .sandbox-content-x {
        width: calc(5 * var(--sandbox-width));
      }

      .sandbox-content-y {
        height: calc(5 * var(--sandbox-height));
      }

      .sandbox-target {
        position: absolute;
        width: 24px;
        height: 24px;
        background-color: red;
      }

      .root-target-x {
        top: 24px;
      }

      .root-target-x.root-target-element {
        left: var(--sandbox-width);
      }

      .root-target-x.root-target-string {
        left: calc(var(--sandbox-width) * 2);
      }

      .root-target-y {
        left: 24px;
      }

      .root-target-y.root-target-element {
        top: var(--sandbox-height);
      }

      .root-target-y.root-target-string {
        top: calc(var(--sandbox-height) * 2);
      }

      .focus-target-y {
        left: 24px;
      }

      .focus-target-element {
        top: var(--sandbox-height);
      }

      .focus-target-string {
        top: calc(var(--sandbox-height) * 2);
      }

      .rtl-target-element {
        right: var(--sandbox-width);
      }

      .rtl-target-string {
        right: calc(var(--sandbox-width) * 2);
      }

      .focus-button {
        display: block;
        border: 1px solid red;
        padding: 12px 24px;
        margin-top: 24px;
        margin-left: 24px;
      }

      .focus-button:focus {
        outline-width: 1px;
        outline-style: solid;
        outline-color: blue;
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <div class="page-target page-target-x page-target-element" data-window-x-target-element></div>

    <div class="sandbox" data-root>
      <div class="sandbox-content sandbox-content-x sandbox-content-y">
        <div class="sandbox-target root-target-x root-target-element" data-root-x-element></div>
        <div class="sandbox-target root-target-y root-target-element" data-root-y-element></div>
      </div>
    </div>

    <div class="spacer small"></div>

    <div class="page-target page-target-y page-target-element" data-window-y-target-element></div>

    <div class="sandbox" data-focus>
      <div class="sandbox-content sandbox-content-y">
        <div class="sandbox-target focus-target-y focus-target-element" data-focus-element></div>
        <button class="focus-button" type="button" data-focus-button>Focus Button</button>
      </div>
    </div>

    <div class="spacer medium"></div>

    <div class="page-target page-target-y page-target-string" data-window-y-target-string></div>

    <div class="sandbox" data-rtl dir="rtl">
      <div class="sandbox-content sandbox-content-x">
        <div class="sandbox-target rtl-target-x rtl-target-element" data-rtl-element></div>
        <div class="sandbox-target rtl-target-x rtl-target-string" data-rtl-string></div>
      </div>
    </div>

    <div class="spacer large"></div>

    <script type="module">
      import jump from "../dist/index.js"

      const jumpAsync = (target, options = {}) =>
        new Promise(resolve => {
          jump(target, {
            ...options,
            callback: () => {
              resolve()
              if (options.callback) options.callback()
            },
          })
        })

      const jumpInstant = (target, options = {}) => jump(target, { ...options, duration: 0 })

      const events = []

      const captureEvent = name => events.push(name)

      let latestRequestAnimationFrameArgs

      const captureRequestAnimationFrameArgs = () => {
        const original = window.requestAnimationFrame.bind(window)

        const wrapped = (...args) => {
          latestRequestAnimationFrameArgs = args
          return original(...args)
        }

        window.requestAnimationFrame = wrapped
      }

      let latestElementFocusArgs

      const captureElementFocusArgs = element => {
        const original = element.focus.bind(element)

        const wrapped = (...args) => {
          latestElementFocusArgs = args
          captureEvent("element-focus")
          original(...args)
        }

        element.focus = wrapped
      }

      let latestElementScrollToArgs

      const captureElementScrollToArgs = element => {
        const original = element.scrollTo.bind(element)

        const wrapped = (...args) => {
          latestElementScrollToArgs = args
          captureEvent("element-scroll")
          original(...args)
        }

        element.scrollTo = wrapped
      }

      let latestWindowScrollToArgs

      const captureWindowScrollToArgs = () => {
        const original = window.scrollTo.bind(window)

        const wrapped = (...args) => {
          latestWindowScrollToArgs = args
          captureEvent("window-scroll")
          original(...args)
        }

        window.scrollTo = wrapped
      }

      window.fixtures = {
        captureEvent,
        getEvents: () => events,

        captureRequestAnimationFrameArgs,
        getLatestRequestAnimationFrameArgs: () => latestRequestAnimationFrameArgs,

        captureElementFocusArgs,
        getLatestElementFocusArgs: () => latestElementFocusArgs,

        captureElementScrollToArgs,
        getLatestElementScrollToArgs: () => latestElementScrollToArgs,

        captureWindowScrollToArgs,
        getLatestWindowScrollToArgs: () => latestWindowScrollToArgs,

        getElement: selector => document.querySelector(selector),
        getElementBounds: element => element.getBoundingClientRect(),
        getElementScrollXMax: element => element.scrollWidth - element.clientWidth,
        getElementScrollYMax: element => element.scrollHeight - element.clientHeight,

        getWindowScrollXMax: () => document.documentElement.scrollWidth - document.documentElement.clientWidth,
        getWindowScrollYMax: () => document.documentElement.scrollHeight - document.documentElement.clientHeight,

        jump,
        jumpAsync,
        jumpInstant,

        wait: time => new Promise(resolve => setTimeout(resolve, time)),
      }
    </script>
  </body>
</html>
