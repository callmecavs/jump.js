<!doctype html>

<html lang="en">
  <head>
    <style>
      .page {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .section {
        display: flex;
        gap: 1rem;
        min-height: 50dvh;
        padding: 2rem;
        border: 2px solid black;
      }

      .section:nth-child(1),
      .section:nth-child(4) {
        justify-content: center;
        align-items: center;
      }

      .section:nth-child(2) {
        flex-direction: column;
        align-items: center;
      }

      .section:nth-child(3) {
        height: 50dvh;
      }

      .buttons {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .horiz,
      .vert {
        overflow: auto;
        overscroll-behavior: contain;
        display: flex;
        gap: 1rem;
      }

      .horiz {
        width: 100%;
      }

      .vert {
        flex-direction: column;
        height: 100%;
      }

      .horiz-item,
      .vert-item {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 45dvw;
        height: 45dvw;
        flex-shrink: 0;
        background-color: black;
        color: white;
      }
    </style>
  </head>

  <body>
    <div class="page">
      <div class="section">
        <div class="buttons">
          <button id="b1" type="button">Down 200 (number)</button>
          <button id="b2" type="button">To 2nd section (string)</button>
          <button id="b3" type="button">To 3rd section (Element)</button>
        </div>
      </div>

      <div class="section">
        <div class="horiz">
          <div class="horiz-item">1</div>
          <div class="horiz-item">2</div>
          <div class="horiz-item">3</div>
        </div>

        <div class="buttons">
          <button id="b4" type="button">To item 1</button>
          <button id="b5" type="button">To item 2</button>
          <button id="b6" type="button">To item 3</button>
        </div>
      </div>

      <div class="section">
        <div class="vert">
          <div class="vert-item">1</div>
          <div class="vert-item">2</div>
          <div class="vert-item">3</div>
        </div>

        <div class="buttons">
          <button id="b7" type="button">To item 1</button>
          <button id="b8" type="button">To item 2</button>
          <button id="b9" type="button">To item 3</button>
        </div>
      </div>

      <div class="section">
        <div class="buttons">
          <button id="b10" type="button">Up 350 (number)</button>
        </div>
      </div>
    </div>

    <script type="module">
      import jump from "../dist/index.mjs"

      const b1 = document.getElementById("b1")
      const b2 = document.getElementById("b2")
      const b3 = document.getElementById("b3")
      const s3 = document.querySelector(".section:nth-child(3)")

      b1.addEventListener("click", () => jump(200, { a11y: true }))
      b2.addEventListener("click", () => jump(".section:nth-child(2)", { a11y: true }))
      b3.addEventListener("click", () => jump(s3, { a11y: true }))

      const b4 = document.getElementById("b4")
      const b5 = document.getElementById("b5")
      const b6 = document.getElementById("b6")
      const horiz = document.querySelector(".horiz")
      const horizItems = Array.from(document.querySelectorAll(".horiz-item"))

      b4.addEventListener("click", () => jump(horizItems[0], { axis: "x", root: horiz }))
      b5.addEventListener("click", () => jump(horizItems[1], { a11y: true, axis: "x", root: horiz }))
      b6.addEventListener("click", () => jump(horizItems[2], { axis: "x", root: horiz }))

      const b7 = document.getElementById("b7")
      const b8 = document.getElementById("b8")
      const b9 = document.getElementById("b9")
      const vert = document.querySelector(".vert")
      const vertItems = Array.from(document.querySelectorAll(".vert-item"))

      b7.addEventListener("click", () => jump(vertItems[0], { a11y: true, axis: "y", root: vert }))
      b8.addEventListener("click", () => jump(vertItems[1], { axis: "y", root: vert }))
      b9.addEventListener("click", () => jump(vertItems[2], { axis: "y", root: vert }))

      const b10 = document.getElementById("b10")

      b10.addEventListener("click", () => jump(-350))
    </script>
  </body>
</html>
